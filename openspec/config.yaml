schema: spec-driven
project: lc-ia_0.2
execution_mode: interactive

artifact_store:
  mode: hybrid

delivery:
  strategy: auto-chain
  review_budget_lines: 800

strict_tdd: true

context: |
  Estado real: implementación Java con reactor Maven compuesto por los módulos synthetic-retrieval y lc-ia-server.
  Pruebas JUnit, pruebas de arquitectura y CI están disponibles.
  La validación raíz es mvn -B clean verify con Java 25.
  No existe una E2E multiproceso completa.
  Los datos reales permanecen fuera de alcance.
  Idioma de documentación: español profesional neutro; código e identificadores futuros: inglés.

testing:
  detected_at: 2026-08-21
  availability: available
  reason: JUnit, pruebas de arquitectura y CI están disponibles en la implementación Java con Maven.
  runner:
    available: true
    framework: JUnit
    command: mvn -B clean verify
  layers:
    unit:
      available: true
      tool: JUnit
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Distinguir decisiones confirmadas, propuestas y pendientes.
    - Mantener fuera de alcance los datos reales hasta superar sus gates.
  specs:
    - Usar escenarios Given/When/Then y términos normativos RFC 2119.
    - Definir primero comportamiento verificable con datos sintéticos.
  design:
    - No convertir el stack objetivo documental en stack implementado sin evidencia del repositorio.
    - Mantener separados los límites de confianza remoto y local.
  tasks:
    - Agrupar por fases y mantener cada tarea ejecutable en una sesión.
    - Respetar la estrategia auto-chain y el presupuesto de revisión de 800 líneas.
  apply:
    guidelines:
      - Seguir las especificaciones aceptadas y crear solo la infraestructura mínima necesaria.
    tdd: true
    test_command: mvn -B clean verify
  verify:
    test_command: mvn -B clean verify
    build_command: mvn -B clean verify
    coverage_threshold: 0
  archive:
    - Advertir antes de integrar deltas destructivos.
